[package]
name = "ballistics-wasm"
description = "wasm-bindgen wrapper: JSON request in, JSON table out"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ballistics-core = { path = "../ballistics-core", features = ["table"] }
wasm-bindgen = "0.2"
serde_json = "1"
